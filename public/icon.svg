<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0077ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#080c14"/>
  <circle cx="256" cy="256" r="210" fill="url(#neonGlow)"/>
  
  <!-- Outer Loop Orbit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="160 50 200 40" stroke-linecap="round" filter="url(#neonBlur)" opacity="0.9"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00a8ff" stroke-width="5" stroke-dasharray="80 30" opacity="0.4"/>
  
  <!-- Repetition Loop Arrows -->
  <path d="M 390 230 A 150 150 0 0 0 160 160" fill="none" stroke="url(#cyberBlue)" stroke-width="12" stroke-linecap="round" filter="url(#neonBlur)"/>
  <polygon points="160,135 130,165 175,185" fill="#00f0ff" filter="url(#neonBlur)"/>
  
  <path d="M 122 282 A 150 150 0 0 0 352 352" fill="none" stroke="url(#cyberBlue)" stroke-width="12" stroke-linecap="round" filter="url(#neonBlur)"/>
  <polygon points="352,377 382,347 337,327" fill="#00f0ff" filter="url(#neonBlur)"/>
  
  <!-- Center Play Hexagon / Triangle Glow -->
  <circle cx="256" cy="256" r="82" fill="#0b1329" stroke="#00f0ff" stroke-width="4" filter="url(#neonBlur)"/>
  <polygon points="230,200 310,256 230,312" fill="url(#cyberBlue)" filter="url(#neonBlur)"/>
</svg>
