name: Build & Release Windows App (Installer & Portable)

# Only run manually on demand via GitHub Actions UI or when a version tag is pushed.
# Normal git pushes will NOT trigger this workflow!
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - build_number
      custom_version:
        description: 'Custom Version (Optional, e.g. 1.2.0 - leaves empty to auto-bump)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine & Bump Version
        id: versioning
        shell: bash
        run: |
          # 1. Determine version
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.custom_version }}"
            echo "Using custom specified version: $NEW_VERSION"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NEW_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using version from git tag: $NEW_VERSION"
          else
            BUMP_TYPE="${{ github.event.inputs.version_bump || 'patch' }}"
            CURRENT_VER=$(node -p "require('./package.json').version || '1.0.0'")
            
            if [ "$BUMP_TYPE" = "build_number" ]; then
              MAJOR=$(echo $CURRENT_VER | cut -d. -f1)
              MINOR=$(echo $CURRENT_VER | cut -d. -f2)
              NEW_VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
            else
              # Use npm version to calculate next semver
              NEW_VERSION=$(npx semver -i $BUMP_TYPE $CURRENT_VER 2>/dev/null || node -e "
                const [maj, min, pat] = '$CURRENT_VER'.split('.').map(Number);
                if ('$BUMP_TYPE' === 'major') console.log(\`\${maj + 1}.0.0\`);
                else if ('$BUMP_TYPE' === 'minor') console.log(\`\${maj}.\${min + 1}.0\`);
                else console.log(\`\${maj}.\${min}.\${pat + 1}\`);
              ")
            fi
            echo "Auto-bumped ($BUMP_TYPE) from $CURRENT_VER to $NEW_VERSION"
          fi

          # 2. Update package.json version
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version

          echo "APP_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$NEW_VERSION" >> $GITHUB_ENV

      - name: Install Project Dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --save-dev --legacy-peer-deps electron@33.2.0 electron-builder@25.1.8

      - name: Compile Vite Frontend
        shell: bash
        run: npm run build

      - name: Package Windows Installer & Portable (.exe)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64

      - name: Verify Generated Binaries
        shell: bash
        run: |
          echo "Generated Windows release executables:"
          ls -lh release/*.exe

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## 🚀 NeonLoop Media Player - Windows Release ${{ env.RELEASE_TAG }}

          ### 📦 فایلهای قابل دانلود برای ویندوز (Download Options for Windows):
          - **نسخه پرتابل بدون نیاز به نصب (Portable Executable):**
            `NeonLoop-Portable-v${{ env.APP_VERSION }}.exe`
            *(بدون نیاز به نصب، اجرای مستقیم با دو بار کلیک از روی هر درایو یا فلش مموری)*
          
          - **نسخه نصبی ویندوز (Setup Installer):**
            `NeonLoop-Setup-v${{ env.APP_VERSION }}.exe`
            *(برنامه کامل با ویزارد نصب، ایجاد آیکون روی دسکتاپ و شورت‌کات در منوی استارت ویندوز)*

          ---

          ### ✨ ویژگی‌های نسخه ${{ env.RELEASE_TAG }}:
          - 🔁 **تکرار خودکار بخش به بخش (Step-by-Step Looping):** برش خودکار و تکرار پشت‌سرهم فایل‌های صوتی و ویدیویی تا انتهای فایل
          - ⚡ **کنترل مستقیم سرعت پخش:** کم و زیاد کردن سرعت (از 0.25x تا 3.0x) همراه با حفظ طبیعی تُن صدا (Pitch Preservation)
          - 🌐 **پخش آنلاین لینک‌های اینترنتی:** پشتیبانی از لینک مستقیم ویدیوها و فایل‌های MKV, MP4, WebM و MP3
          - 🎙️ **سوییچ بین زبان‌های صوتی (Multi-Audio Tracks):** قابلیت تغییر صوت در فایل‌های چندزبانه و افزودن صوت دوبله فارسی
          - 📝 **پشتیبانی از زیرنویس (SRT & VTT):** نمایش تمیز زیرنویس با قابلیت تغییر سایز فونت
          - 🌌 **تم شیک نئونی دارک:** هاله نوری و نورپردازی تطبیقی با ریتم و فرکانس‌های صدا
          - 💾 **خروجی گرفتن از فایل تکرار شده (Export Media):** رندر و دانلود فایل صوتی (WAV) یا ویدیویی (WebM)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NeonLoop Media Player ${{ env.RELEASE_TAG }} (Windows)
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
